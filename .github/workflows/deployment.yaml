name: Recruit_Ai CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =======================================================
  # BACKEND CI
  # =======================================================

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check backend imports
        env:
          # MongoDB - CI test value
          MONGO_URI: "mongodb://localhost:27017/recruit_ai_ci"

          # Cloudflare R2 - GitHub Secrets
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

          # Groq - GitHub Secret
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          # JWT - GitHub Secret
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

        run: |
          echo "Checking backend environment..."

          python -c "import os; print('MONGO_URI exists:', bool(os.getenv('MONGO_URI')))"
          python -c "import os; print('R2_ENDPOINT exists:', bool(os.getenv('R2_ENDPOINT')))"
          python -c "import os; print('R2_ACCESS_KEY_ID exists:', bool(os.getenv('R2_ACCESS_KEY_ID')))"
          python -c "import os; print('R2_SECRET_ACCESS_KEY exists:', bool(os.getenv('R2_SECRET_ACCESS_KEY')))"
          python -c "import os; print('R2_BUCKET exists:', bool(os.getenv('R2_BUCKET')))"
          python -c "import os; print('GROQ_API_KEY exists:', bool(os.getenv('GROQ_API_KEY')))"
          python -c "import os; print('SECRET_KEY exists:', bool(os.getenv('SECRET_KEY')))"

          python -c "from app.main import app; print('FastAPI backend import successful')"


  # =======================================================
  # FRONTEND CI
  # =======================================================

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build