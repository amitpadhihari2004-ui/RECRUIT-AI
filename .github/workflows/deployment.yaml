name: Recruit_Ai CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =======================================================
  # BACKEND CI
  # =======================================================

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check backend imports
        env:
          MONGO_URI: "mongodb://localhost:27017/recruit_ai_ci"
        run: |
          echo "MONGO_URI is configured for CI"
          python -c "import os; print('MONGO_URI exists:', bool(os.getenv('MONGO_URI')))"
          python -c "from app.main import app; print('FastAPI backend import successful')"


  # =======================================================
  # FRONTEND CI
  # =======================================================

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build